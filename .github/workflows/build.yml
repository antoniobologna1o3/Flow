name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes the older run pointless. ForgeGradle
# builds are not cheap, so cancel rather than queue.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # The first run on a cold cache has to download and decompile Minecraft,
    # which is slow. Cached runs are far quicker.
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # Minecraft 1.20.1 targets Java 17, and ForgeGradle 6 expects to run on it.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Caches ~/.gradle, which includes ForgeGradle's decompiled Minecraft,
      # and validates the wrapper checksum.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # `build` runs the unit tests too, via the standard check task.
      - name: Build and test
        run: ./gradlew build --no-daemon --stacktrace

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test/
          retention-days: 14

      # Lets the mod be downloaded and played without a local toolchain.
      - name: Upload mod jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: netherfront-jar
          path: build/libs/*.jar
          retention-days: 30
